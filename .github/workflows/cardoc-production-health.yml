name: Car Doc production health (manual diagnostic)

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MONITOR_BASE_URL: ${{ secrets.MONITOR_BASE_URL }}
      MONITOR_HEALTH_TOKEN: ${{ secrets.MONITOR_HEALTH_TOKEN }}
      MONITOR_USER_EMAIL: ${{ secrets.MONITOR_USER_EMAIL }}
      MONITOR_USER_PASSWORD: ${{ secrets.MONITOR_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run read-only monitoring diagnostic
        run: npm run monitor:smoke

      - name: Upload sanitized metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardoc-monitoring-result
          path: artifacts/monitoring/result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cardoc-monitoring-playwright-failure
          path: artifacts/monitoring/playwright/results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnostic-only notice
        if: always()
        run: |
          echo "This workflow is diagnostic-only."
          echo "It does not send Better Stack heartbeats or production monitoring alerts."
