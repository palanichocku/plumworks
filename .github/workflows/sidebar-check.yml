name: Sidebar branch check

on:
  push:
    branches:
      - feat/collapsible-sidebar-16

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint changed files
        run: npx eslint src/components/app-shell.tsx src/components/app-navigation.tsx src/components/sidebar-controls.tsx
      - name: Type check
        run: npx tsc --noEmit
