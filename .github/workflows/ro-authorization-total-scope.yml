name: RO authorization total scope

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ro-authorization-total-scope.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch authorization validity to follow estimate total
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('src/lib/authorization/repair-order-evidence.ts')
          s = evidence.read_text()
          old = """      AND dr.snapshot_sha256 = ${current.hash}\n      AND ae.decision = 'APPROVED'::\"AuthorizationDecision\""""
          new = """      AND dr.total = ${current.total}::decimal\n      AND ae.decision = 'APPROVED'::\"AuthorizationDecision\""""
          if old not in s:
              raise SystemExit('Expected authorization summary hash check not found')
          evidence.write_text(s.replace(old, new, 1))

          remote = Path('src/lib/authorization/remote-repair-order-authorization.ts')
          s = remote.read_text()
          s = s.replace('import { ensureCurrentRepairOrderRevision, getRepairOrderAuthorizationSummaryForShop } from "@/lib/authorization/repair-order-evidence";', 'import { ensureCurrentRepairOrderRevision } from "@/lib/authorization/repair-order-evidence";')
          old_pending = """  if (effectiveStatus === \"PENDING\") {\n    const current = await getRepairOrderAuthorizationSummaryForShop(row.shopId, row.documentId);\n    if (!current || current.currentSnapshotSha256 !== row.snapshotSha256) effectiveStatus = \"SUPERSEDED\";\n  }"""
          new_pending = """  if (effectiveStatus === \"PENDING\") {\n    const currentRevision = await ensureCurrentRepairOrderRevision(row.shopId, row.documentId);\n    if (!currentRevision || currentRevision.total !== Number(row.total).toFixed(2)) effectiveStatus = \"SUPERSEDED\";\n  }"""
          if old_pending not in s:
              raise SystemExit('Expected pending authorization hash check not found')
          s = s.replace(old_pending, new_pending, 1)
          old_decision = '    if (!currentRevision || currentRevision.snapshotSha256 !== row.snapshotSha256) {'
          new_decision = '    if (!currentRevision || currentRevision.total !== Number(row.total).toFixed(2)) {'
          if old_decision not in s:
              raise SystemExit('Expected decision authorization hash check not found')
          s = s.replace(old_decision, new_decision, 1)
          remote.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/authorization/repair-order-evidence.ts src/lib/authorization/remote-repair-order-authorization.ts
          git commit -m "fix(ro): require reauthorization only when estimate total changes"
          git push origin dev
