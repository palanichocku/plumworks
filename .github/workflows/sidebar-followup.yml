name: Sidebar follow-up verification
on:
  pull_request:
    paths:
      - "src/components/app-navigation.tsx"
      - "src/components/app-shell.tsx"
      - "src/components/sidebar-controls.tsx"
      - ".github/workflows/sidebar-followup.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npx eslint src/components/app-navigation.tsx src/components/app-shell.tsx src/components/sidebar-controls.tsx
      - run: npx tsc --noEmit
