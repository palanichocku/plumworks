name: Fix invoice document totals

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-invoice-document-totals.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Harden invoice print and email totals layouts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Browser print renderer: avoid Chrome print fragmentation/grid overlap.
          p = Path('src/components/invoice-document-html.tsx')
          s = p.read_text()
          detail = '''function Detail({ label, value }: { label: string; value: string | number | null | undefined }) {\n  if (value === null || value === undefined || value === "") return null;\n  return <div><dt>{label}</dt><dd>{value}</dd></div>;\n}\n'''
          total_detail = '''function TotalDetail({ label, value, grand = false }: { label: string; value: string | number | null | undefined; grand?: boolean }) {\n  if (value === null || value === undefined || value === "") return null;\n  return <div\n    className={grand ? "invoice-document-grand-total" : undefined}\n    style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "12pt", padding: "2pt 0", breakInside: "avoid", pageBreakInside: "avoid" }}\n  ><dt style={{ flex: "1 1 auto", minWidth: 0 }}>{label}</dt><dd style={{ flex: "0 0 auto", textAlign: "right", whiteSpace: "nowrap" }}>{value}</dd></div>;\n}\n'''
          if total_detail not in s:
              if detail not in s:
                  raise SystemExit('Detail helper not found')
              s = s.replace(detail, detail + '\n' + total_detail, 1)

          s = s.replace('<section className="invoice-document-bottom">', '<section className="invoice-document-bottom" style={{ display: "flex", alignItems: "flex-start", gap: "18pt" }}>', 1)
          s = s.replace('<div className="invoice-document-legal">', '<div className="invoice-document-legal" style={{ flex: "1 1 0", minWidth: 0 }}>', 1)

          old_totals = '''<div className="invoice-document-totals"><h2>Totals</h2><dl><Detail label="Parts" value={model.totals.parts} /><Detail label="Labor" value={model.totals.labor} /><Detail label="Shop supplies" value={model.totals.shopSupplies} /><Detail label="Subtotal before tax" value={model.totals.displaySubtotalBeforeTax} />{model.totals.discount !== "$0.00" && model.totals.discount !== "-$0.00" ? <Detail label="Discount" value={model.totals.discount} /> : null}{model.legacyCharges.map((charge) => <Detail key={charge.label} label={charge.label} value={charge.amount} />)}<Detail label="Tax" value={model.totals.tax} /><div className="invoice-document-grand-total"><dt>Total</dt><dd>{model.totals.total}</dd></div><Detail label="Amount paid" value={model.totals.amountPaid} /><Detail label="Balance due" value={model.totals.balanceDue} /><Detail label="Payment status" value={model.totals.paymentStatus} /></dl>{model.paymentMethods.length > 0 && <p>Payments: {model.paymentMethods.map((payment) => `${payment.method} ${payment.amount}`).join("; ")}</p>}</div>'''
          new_totals = '''<div className="invoice-document-totals" style={{ flex: "0 0 190pt", minWidth: "190pt", breakInside: "avoid", pageBreakInside: "avoid" }}><h2>Totals</h2><dl><TotalDetail label="Parts" value={model.totals.parts} /><TotalDetail label="Labor" value={model.totals.labor} /><TotalDetail label="Shop supplies" value={model.totals.shopSupplies} /><TotalDetail label="Subtotal before tax" value={model.totals.displaySubtotalBeforeTax} />{model.totals.discount !== "$0.00" && model.totals.discount !== "-$0.00" ? <TotalDetail label="Discount" value={model.totals.discount} /> : null}{model.legacyCharges.map((charge) => <TotalDetail key={charge.label} label={charge.label} value={charge.amount} />)}<TotalDetail label="Tax" value={model.totals.tax} /><TotalDetail label="Total" value={model.totals.total} grand /><TotalDetail label="Amount paid" value={model.totals.amountPaid} /><TotalDetail label="Balance due" value={model.totals.balanceDue} /><TotalDetail label="Payment status" value={model.totals.paymentStatus} /></dl>{model.paymentMethods.length > 0 && <p style={{ marginTop: "5pt", lineHeight: 1.3 }}>Payments: {model.paymentMethods.map((payment) => `${payment.method} ${payment.amount}`).join("; ")}</p>}</div>'''
          if old_totals not in s:
              raise SystemExit('HTML totals block not found')
          s = s.replace(old_totals, new_totals, 1)
          p.write_text(s)

          # Email PDF renderer: explicit label/value widths keep long labels away from amounts.
          p = Path('src/components/pdf/invoice-document-pdf.tsx')
          s = p.read_text()
          old_styles = '''  totals: { width: 190 },\n  totalRow: { flexDirection: "row", justifyContent: "space-between", paddingVertical: 2 },\n  grandTotal: { borderTop: "1pt solid #000000", marginTop: 2, paddingTop: 4, fontSize: 10 },'''
          new_styles = '''  totals: { width: 190 },\n  totalRow: { flexDirection: "row", alignItems: "flex-start", paddingVertical: 2 },\n  totalLabel: { flexGrow: 1, flexBasis: 0, paddingRight: 8 },\n  totalValue: { width: 68, textAlign: "right" },\n  grandTotal: { borderTop: "1pt solid #000000", marginTop: 2, paddingTop: 4, fontSize: 10 },'''
          if old_styles not in s:
              raise SystemExit('PDF total styles not found')
          s = s.replace(old_styles, new_styles, 1)

          start = s.index('        <View style={styles.totals} wrap={false}>')
          end = s.index('        </View>\n      </View>', start) + len('        </View>')
          block = s[start:end]
          block = re.sub(
              r'<View style=\{styles\.totalRow\}><Text>(.*?)</Text><Text>(.*?)</Text></View>',
              r'<View style={styles.totalRow}><Text style={styles.totalLabel}>\1</Text><Text style={styles.totalValue}>\2</Text></View>',
              block,
          )
          block = re.sub(
              r'<View key=\{charge\.label\} style=\{styles\.totalRow\}><Text>(.*?)</Text><Text>(.*?)</Text></View>',
              r'<View key={charge.label} style={styles.totalRow}><Text style={styles.totalLabel}>\1</Text><Text style={styles.totalValue}>\2</Text></View>',
              block,
          )
          block = re.sub(
              r'<View style=\{\[styles\.totalRow, styles\.grandTotal\]\}><Text>(.*?)</Text><Text>(.*?)</Text></View>',
              r'<View style={[styles.totalRow, styles.grandTotal]}><Text style={styles.totalLabel}>\1</Text><Text style={styles.totalValue}>\2</Text></View>',
              block,
          )
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/invoice-document-html.tsx src/components/pdf/invoice-document-pdf.tsx
          git commit -m "fix(invoice): prevent totals overlap in print and PDF"
          git push origin dev
